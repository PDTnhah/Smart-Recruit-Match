[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "srm-ai-service"
version = "0.1.0"
description = "Smart Recruit Match AI Service: CV/JD parsing, matching, test generation and grading agents"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "ruff==0.16.10",  # pinned: new ruff minors can add rules to the selected groups
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
