[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "srm-ai-service"
version = "0.1.0"
description = "Smart Recruit Match AI Service: CV/JD parsing, matching, test generation and grading agents"
requires-python = ">=3.12"
# Exact pins, each released at least two weeks before it was added (CONTEXT D33).
dependencies = [
  "faststream[rabbit,cli]==0.7.7",
  "fastapi==0.142.2",
  "uvicorn==0.54.0",
  "pydantic==2.13.5",
  "psycopg[binary]==3.3.6",
  "psycopg-pool==3.3.3",
  # LLM providers, used only from app/llm (CONTEXT D34).
  "google-genai==2.28.0",
  "anthropic==1.11.0",
  "jinja2==3.1.6",
  # Request/response logs in the llm-logs bucket (AC-6).
  "minio==7.2.20",
  # Text and hidden-text extraction from uploaded PDF and DOCX files (app/parsing, CONTEXT D35).
  # PyMuPDF reports colour, size and position per span (CONTEXT D3).
  "pymupdf==1.28.2",
  "python-docx==1.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "ruff==0.16.10",  # pinned: new ruff minors can add rules to the selected groups
  "httpx==0.28.1",
  # Generates app/contracts from the Zod contracts (pnpm contracts:gen). Pinned: CI fails when the
  # output changes, and the output depends on the generator version.
  "datamodel-code-generator==0.83.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.contracts" = ["*.json"]
# Versioned prompts ship in the image; the manifest pins released files (AD-12).
"app.prompts" = ["*.json", "*/*.md"]

[tool.ruff]
target-version = "py312"
line-length = 100
# Generated by `pnpm contracts:gen`; checked for drift in CI instead of linted.
extend-exclude = ["app/contracts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Used by `pnpm contracts:gen` (scripts/gen-contracts.mjs), which runs the generator from this
# directory. app/contracts holds generated files only (AD-6).
[tool.datamodel-codegen]
input = "../packages/shared/contracts/json-schema"
input-file-type = "jsonschema"
output = "app/contracts"
output-model-type = "pydantic_v2.BaseModel"
target-python-version = "3.12"
use-title-as-name = true
use-standard-collections = true
use-union-operator = true
use-annotated = true
field-constraints = true
use-schema-description = true
use-field-description = true
disable-timestamp = true
custom-file-header = "# generated by `pnpm contracts:gen` from packages/shared/contracts - do not edit"
# The builtin formatter keeps the output independent of black/isort versions.
formatters = ["builtin"]
