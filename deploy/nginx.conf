# Serves the web SPA and proxies the Core Backend (ARCHITECTURE › Deployment architecture).
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Container healthcheck.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Server-Sent Events (US-1.7): no buffering, long-lived connection.
  location /api/events/stream {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 6m;
  }

  # Hashed build assets can be cached for a long time.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA routes (/sv/*, /hr/*, /admin/*) fall back to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
